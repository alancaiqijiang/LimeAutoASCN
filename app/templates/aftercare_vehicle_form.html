{% extends "base.html" %}
{% block title %}{{ t.register_vehicle_title }}{% endblock %}
{% block content %}
<section class="account-page account-narrow"><div class="account-card"><p class="eyebrow">LimeAuto Aftercare</p><h1>{{ t.register_vehicle_heading }}</h1>{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}<form class="account-form" action="/ops/vehicles" method="post"><input type="hidden" name="csrf_token" value="{{ aftercare_csrf_token }}"><label>VIN<input name="vin" value="{{ vehicle.vin if vehicle else '' }}" autocomplete="off" autocapitalize="characters" spellcheck="false" required><small>{{ t.vin_help }}</small></label><label>{{ t.brand_if_known }}<input name="brand" value="{{ vehicle.brand if vehicle else '' }}"></label><label>{{ t.model_if_known }}<input name="model_label" value="{{ vehicle.model_label if vehicle else '' }}"></label><label>{{ t.model_year }}<input type="number" min="1900" max="2100" name="model_year" value="{{ vehicle.model_year if vehicle and vehicle.model_year else '' }}"></label><label>{{ t.color }}<input name="color" value="{{ vehicle.color if vehicle else '' }}"></label><label>{{ t.delivery_date }}<input type="date" name="delivery_date" value="{{ vehicle.delivery_date if vehicle else '' }}"></label><label>{{ t.registration_date }}<input type="date" name="registration_date" value="{{ vehicle.registration_date if vehicle else '' }}"></label><label>{{ t.departure_date }}<input type="date" name="departure_date" value="{{ vehicle.departure_date if vehicle else '' }}"></label><label>{{ t.license_plate_date }}<input type="date" name="license_plate_date" value="{{ vehicle.license_plate_date if vehicle else '' }}"></label><label>{{ t.internal_note }}<textarea name="note" rows="4">{{ vehicle.note if vehicle else '' }}</textarea></label><div class="button-row"><button type="submit">{{ t.save_vehicle }}</button><a class="button-secondary" href="/ops/vehicles">{{ t.cancel }}</a></div></form></div></section>
{% endblock %}
